name: Extract ZIP into repo

on:
  push:
    paths:
      - 'WordPopup.zip'   # đổi tên này nếu file zip bạn up lên tên khác
  workflow_dispatch: {}

permissions:
  contents: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Giải nén zip vào thư mục tạm
        run: |
          rm -rf /tmp/wp_extract
          mkdir -p /tmp/wp_extract
          unzip -o WordPopup.zip -d /tmp/wp_extract

      - name: Copy nội dung ra root repo
        run: |
          cp -a /tmp/wp_extract/WordPopup/. .
          rm -f WordPopup.zip

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-extract WordPopup.zip vào repo"
          git push
